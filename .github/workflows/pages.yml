name: Publish

# Validates the skill data on every push, and publishes the site to GitHub
# Pages from main.
#
# Pages must be switched on once, by hand, before the deploy job can work:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# The workflow cannot do this for itself. configure-pages has an
# `enablement` option that calls the create-Pages-site API, but the
# built-in GITHUB_TOKEN is not allowed to use it ("Resource not accessible
# by integration") — creating the site needs repo-admin rights.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a queued one finish rather than
# cancelling a half-finished publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate skill data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check ids, prerequisites, tiers and reachability
        run: node tools/validate.js
      - name: Check the board layout has no overlapping nodes
        run: node tools/layout-check.js

  deploy:
    name: Deploy to Pages
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
