name: Publish

# Validates the skill data on every push, and publishes the site to GitHub
# Pages from main. Pages must be enabled once, by hand, under
# Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a queued one finish rather than
# cancelling a half-finished publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate skill data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check ids, prerequisites, tiers and reachability
        run: node tools/validate.js

  deploy:
    name: Deploy to Pages
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # enablement turns Pages on via the API if it is off, which it is by
      # default — otherwise this step fails and the deploy never runs.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
